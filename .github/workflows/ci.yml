name: DCS CI/CD & Automated Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint and Static Type Check
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy types-requests
          ruff check src/
          ruff format --check src/
          mypy src/resilient_pid/

  unit-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Test Suite
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .
          pytest tests/test_pid_math.py -v

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU and Buildx (required for advanced caching features)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build container utilizing GitHub Actions Cache
      - name: Verify Docker Container Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: resilient-pid-test:latest
          push: false                         # Only tests the build, doesn't push
          cache-from: type=gha                # Pulls layers from GitHub cache
          cache-to: type=gha,mode=max         # Saves layers to GitHub cache

  publish-release:
    needs: [static-analysis, unit-testing, docker-build-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build PEP 517 Wheel & Sdist
        run: |
          pip install --upgrade build
          python -m build
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
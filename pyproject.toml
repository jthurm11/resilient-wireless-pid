[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-wireless-pid"
version = "1.0.0"
description = "A software-defined framework for hardening wireless control loops against jitter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jacob Thurman", email = "jacob.thurman@uconn.edu"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "influxdb-client>=1.36.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "flask>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/jthurm11/resilient-wireless-pid"

[project.scripts]
run-controller = "resilient_pid.main:main"
run-plant = "resilient_pid.plant.plant_interface:main"
run-c2 = "resilient_pid.c2.c2_server:main"
run-netem = "resilient_pid.emulation.traffic_control:main"

[tool.setuptools.packages.find]
where = ["src"]
